name: covid
display_name: Medical (COVID-19)
description: >-
  Anonymised patient, laboratory and outcome records from Hospital
  Sirio-Libanes, published through the FAPESP COVID-19 Data Sharing/BR
  repository. Publicly available; see docs/DATA.md for the download procedure.

database: covid.sqlite
database_sha256: f62d146e48060d91a1f207c114981b651ca9b67aff5cbeaa22912a4fce2c3fff
expects_views: []

prompt_dir: covid

# The laboratory results carry their own unit per row, in CD_UNIDADE, so only
# the date and identifier columns get a static annotation here.
units:
  AA_NASCIMENTO: ano
  DT_COLETA: data (YYYY-MM-DD)
  DT_ATENDIMENTO: data (YYYY-MM-DD)
  DT_DESFECHO: data (YYYY-MM-DD)

profiles:
  - Enfermeiro
  - Familiar de um Paciente
  - Gestor Hospitalar
  - Médico
  - Paciente
  - Pesquisador em Saúde Pública
