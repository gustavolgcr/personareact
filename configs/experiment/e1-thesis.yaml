name: e1-thesis
description: >-
  Experiment 1 reproduced as it was actually run in 2025: the nested
  Text-to-SQL agent as the only tool, five iterations, and a Tailor step that
  sees the whole scratchpad including the standard answer.

  Use this to reproduce the published numbers. Use `e1` for the corrected
  method. The two differ by exactly the deviations documented in
  docs/ERRATA.md and docs/REVIEW.md, which is what makes the pair informative.

