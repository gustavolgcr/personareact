name: personareact
display_name: PersonaReAct
description: >-
  The proposed method: the Reason-Act cycle followed by an explicit
  personalization step (the Tailor function tau(p, O*) of section 4.2).
  With no profile supplied it degrades to plain ReAct, which is the backward
  compatibility claimed in section 4.4.
use_reasoning: true
use_tools: true
use_tailor: true

toolset: primitives
max_iterations: 8

# What the Tailor step is shown.
#   observations  only O*, which is what section 4.2 formalises: tau maps the
#                 profile and the *observations* to the final message. This is
#                 the default because it is what the thesis describes.
#   context       the whole scratchpad -- thoughts, actions, observations AND
#                 the line "Standard Answer: ...". This is what the thesis
#                 implementation actually did, so the Tailor rewrote a finished
#                 answer instead of composing from the retrieved facts. See
#                 configs/approach/personareact-thesis.yaml.
tailor_sees: observations
