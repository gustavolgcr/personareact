name: personareact-obs
display_name: PersonaReAct (Tailor sees only O*)
description: >-
  The proposed method: the Reason-Act cycle followed by an explicit
  personalization step (the Tailor function tau(p, O*) of section 4.2).
  With no profile supplied it degrades to plain ReAct, which is the backward
  compatibility claimed in section 4.4.
use_reasoning: true
use_tools: true
use_tailor: true
max_iterations: 5

# What the Tailor step is shown.
#   context       the whole scratchpad -- thoughts, actions, observations AND
#                 the standard answer. This is what the thesis implementation
#                 did, so it is the default and keeps results comparable.
#   observations  only O*, which is what section 4.2 actually formalises
#                 (tau : P x O* -> M).
# The difference is worth measuring: with `context`, the Tailor rewrites a
# finished answer and its wording anchors the result; with `observations` it
# composes from the retrieved facts. See configs/approach/personareact-obs.yaml.
tailor_sees: observations
