name: react_enriched
display_name: ReAct + enriched prompt
description: >-
  ReAct with the user profile appended to the question. The competing
  personalization strategy, and PersonaReAct's closest competitor in the
  thesis results.

  The suffix below is the exact text from the original implementation
  (react/src/main.py, line 86, where it lived commented out). A second and
  different implementation of this condition existed in the
  react_prompt_personalization project, which produced no data; see
  docs/ERRATA.md (RP-02).
use_reasoning: true
use_tools: true
use_tailor: false

# See configs/approach/react-thesis.yaml for the original behaviour, where the
# single tool was itself a ReAct agent and the outer loop ran exactly twice in
# 42 of 47 traces (docs/REVIEW.md, section 2.2).
toolset: primitives

# Raised from the thesis' 5 because primitives need more steps for the same
# work: list tables, describe them, query, and possibly correct a SQL error.
# With the nested agent all of that happened inside one call.
max_iterations: 8

question_suffix: " Mude a resposta com base no perfil do usuário que fez a pergunta: {profile}."
