# Runs the offline half of the project: lint, format, and the test suite.
#
# Nothing here calls an LLM. Every test either works on committed fixtures or
# builds a throwaway SQLite database in a temp directory, so CI needs no API
# key and costs nothing. That is deliberate -- a workflow that could spend
# money on a push is a workflow nobody dares to leave enabled.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        # `analysis` brings scipy/matplotlib for the statistics and figures.
        # `judge` brings deepeval, so the registration shim is exercised --
        # those tests skip cleanly without it, and a silent skip is exactly
        # the failure mode worth avoiding here.
        # `embeddings` is deliberately excluded: it pulls PyTorch (~1.3 GB)
        # and the tests that need it are already skipped by design.
        run: uv sync --extra analysis --extra judge --extra dev

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Format
        run: uv run ruff format --check src tests scripts

      - name: Tests
        run: uv run pytest -q

      - name: The CLI is importable and the configs resolve
        # Catches packaging breakage and a malformed YAML, which unit tests
        # can miss because they import the package rather than the entry point.
        run: |
          uv run personareact list
          uv run personareact describe e1
          uv run personareact corpus stats
